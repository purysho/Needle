name: Bug report
description: Something is not working as described
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 10/11, macOS version, or Linux distro"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag you downloaded, or the commit if running from source.
  - type: dropdown
    id: run-method
    attributes:
      label: Run method
      options:
        - Downloaded release
        - Run from source
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. \n2. \n3. "
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: "Status-bar message or traceback. Remove tokens, passwords and private paths first."
      render: text
