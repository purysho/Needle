name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        shell: powershell
        run: .\build-windows.ps1
      - name: Create checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash 'dist\Needle.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  Needle.exe" | Out-File -Encoding ascii 'dist\Needle.exe.sha256'
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Needle.exe
            dist/Needle.exe.sha256
